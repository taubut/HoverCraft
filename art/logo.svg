<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="70%">
      <stop offset="0" stop-color="#1b3a2b"/>
      <stop offset="0.55" stop-color="#101d18"/>
      <stop offset="1" stop-color="#080d0b"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dffb0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4cc776" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4cc776" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfeedd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#4cc776" stroke-opacity="0.45" stroke-width="6"/>

  <!-- healing circle on the ground -->
  <ellipse cx="256" cy="378" rx="170" ry="62" fill="url(#pool)"/>
  <ellipse cx="256" cy="378" rx="150" ry="50" fill="none" stroke="#4cc776" stroke-width="16" filter="url(#glow)" opacity="0.9"/>
  <ellipse cx="256" cy="378" rx="150" ry="50" fill="none" stroke="#8dffb8" stroke-width="7"/>
  <ellipse cx="256" cy="378" rx="112" ry="36" fill="none" stroke="#4cc776" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="14 12"/>

  <!-- cursor's shadow on the circle -->
  <ellipse cx="262" cy="378" rx="54" ry="13" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <!-- air lines: it's hovering -->
  <g fill="none" stroke="#b8ffd3" stroke-linecap="round">
    <path d="M206 290 q 22 -10 44 0 t 44 0" stroke-width="6" opacity="0.8"/>
    <path d="M220 312 q 18 -8 36 0 t 36 0" stroke-width="5" opacity="0.55"/>
  </g>

  <!-- the pointer -->
  <g transform="translate(196 44) scale(1.15)">
    <path d="M0 0 V170 L42 130 L70 195 L100 182 L72 118 H128 Z"
          fill="#4cc776" stroke="#4cc776" stroke-width="18" stroke-linejoin="round" filter="url(#glow)" opacity="0.8"/>
    <path d="M0 0 V170 L42 130 L70 195 L100 182 L72 118 H128 Z"
          fill="url(#cursor)" stroke="#07100c" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#d9ffe8">
    <path d="M116 300 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 z"/>
    <path d="M392 262 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z" opacity="0.85"/>
    <path d="M404 404 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z" opacity="0.6"/>
  </g>
</svg>
